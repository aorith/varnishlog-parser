services:
  varnish:
    image: varnish:8
    volumes:
      - ./main.vcl:/etc/varnish/default.vcl:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    ports:
      - "8001:80"
    depends_on:
      - whoami
      - varnishbackend
    networks:
      varnish_network:
        ipv4_address: 192.168.50.10
    command:
      - -p
      - vsl_mask=all,-Debug

  varnishbackend:
    image: varnish:8
    volumes:
      - ./backend.vcl:/etc/varnish/default.vcl:ro
    tmpfs:
      - /var/lib/varnish/varnishd:exec
    depends_on:
      - whoami
    networks:
      varnish_network:
        ipv4_address: 192.168.50.11
    command:
      - -p
      - vsl_mask=all,-Debug

  whoami:
    image: traefik/whoami
    networks:
      varnish_network:
        ipv4_address: 192.168.50.12

networks:
  varnish_network:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.50.0/24
