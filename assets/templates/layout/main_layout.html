<!DOCTYPE html>
<!-- templates/layout/main_layout.html -->
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="color-scheme" content="light dark">
		<meta name="robots" content="index, follow">
		<script src="/static/vendor/htmx.min-4.0.0.js"></script>
		<script src="/static/history.js"></script>
		<script src="/static/tabs.js" defer></script>
		<script src="/static/submenu.js" defer></script>
		<script src="/static/duplicate_headers.js" defer></script>
		<link rel="stylesheet" href="/static/style.css">
		<link rel="icon" type="image/x-icon" href="/static/favicon.ico">
		<title>{{- if .Title -}}{{- .Title -}}{{ else }}Varnishlog Parser{{- end -}}</title>
	</head>

	<body>
		<!-- Navigation -->
		<nav>
			<div>
				<a class="nav-link" href="#parse-view">PARSE</a>
				|
				<a class="nav-link" href="#overview-view">Overview</a>
				|
				<a class="nav-link" href="#vcllogtree-view">LogTree</a>
				|
				<a class="nav-link" href="#headers-view">Headers</a>
				|
				<a class="nav-link" href="#bandwidth-view">Bandwidth</a>
				|
				<a class="nav-link" href="#timings-view">Timings</a>
				|
				<a class="nav-link" href="#reqbuild-view">ReqBuild</a>
			</div>
		</nav>

		<div id="content">
			{{ block "error" . }}
			<!-- Errors -->
			{{ end }}
			{{ block "content" . }}
			<!-- Content -->
			{{ end }}
		</div>

		<footer>
			<div>
				Varnishlog Parser

				<a rel="nofollow noopener"
				   target="_blank"
				   href="https://github.com/aorith/varnishlog-parser"
				>Source code <svg width="13.5" height="13.5" aria-hidden="true" viewBox="0 0 24 24" class="iconExternalLink_nPIU"><path fill="currentColor" d="M21 13v10h-21v-19h12v2h-10v15h17v-8h2zm3-12h-10.988l4.035 4-6.977 7.07 2.828 2.828 6.977-7.07 4.125 4.172v-11z"></path></svg></a>
				&nbsp;
				<abbr title="Version">{{ .Version }}</abbr>
			</div>
		</footer>
	</body>
</html>
